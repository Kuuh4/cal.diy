name: Build ARM64 images for Orange Pi

on:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  NEXT_PUBLIC_WEBAPP_URL: https://agenda.kuuh.art
  NEXT_PUBLIC_API_V2_URL: https://agenda.kuuh.art/api/v2

jobs:
  build-web:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image (native arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/kuuh4/cal-diy-web:latest
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=${{ env.NEXT_PUBLIC_WEBAPP_URL }}
            NEXT_PUBLIC_API_V2_URL=${{ env.NEXT_PUBLIC_API_V2_URL }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            CALENDSO_ENCRYPTION_KEY=${{ secrets.CALENDSO_ENCRYPTION_KEY }}
            DATABASE_URL=${{ secrets.DEPLOY_DATABASE_URL }}
            DATABASE_DIRECT_URL=${{ secrets.DEPLOY_DATABASE_URL }}
            CALCOM_TELEMETRY_DISABLED=1

  build-api:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image (native arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/v2/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/kuuh4/cal-diy-api:latest
          build-args: |
            DATABASE_URL=${{ secrets.DEPLOY_DATABASE_URL }}
            DATABASE_DIRECT_URL=${{ secrets.DEPLOY_DATABASE_URL }}

